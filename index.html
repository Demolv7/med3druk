<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MED3DRUK | Catalog 12</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ff0000;
            --primary: #000000;
            --bg: #ffffff;
            --light-gray: #f5f5f7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 20px 5%;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -1px; text-decoration: none; color: #000; }
        .logo span { color: var(--accent); }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .viewer-box {
            width: 100%;
            height: 320px;
            background: var(--light-gray);
            position: relative;
        }

        /* ОПТИМІЗАЦІЯ ПАМ'ЯТІ */
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        .info-box {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .model-id { font-weight: 800; font-size: 2rem; margin: 0; letter-spacing: -1px; }
        .line { width: 30px; height: 4px; background: var(--accent); margin: 10px 0; }
        
        .description { 
            color: #666; 
            font-size: 0.9rem; 
            line-height: 1.4; 
            margin-bottom: 20px;
            min-height: 2.8em;
        }

        .ar-btn {
            background: #fff;
            color: #000;
            border-radius: 50px;
            border: 1px solid #ddd;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 11px;
            position: absolute;
            bottom: 15px;
            right: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-order {
            margin-top: auto;
            background: var(--primary);
            color: #fff;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            text-align: center;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-order:hover { background: var(--accent); }

        footer { text-align: center; padding: 60px 20px; color: #bbb; border-top: 1px solid #eee; margin-top: 40px; }

        @media (max-width: 600px) {
            .catalog-grid { grid-template-columns: 1fr; padding: 15px; }
            .viewer-box { height: 350px; }
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">MED3<span>DRUK</span></a>
    <div style="font-size: 0.7rem; font-weight: 800; color: #ccc;">STUDIO | 12 MODELS</div>
</header>

<div class="catalog-grid" id="main-grid">
    <script>
        const grid = document.getElementById('main-grid');
        const descriptions = [
            "Класична анатомічна форма.",
            "Легка перфорована модель.",
            "Агресивний футуристичний дизайн.",
            "Ергономічна спортивна серія.",
            "Посилена структура M5.",
            "Мінімалістичний матовий фініш.",
            "Покращена аеродинаміка M7.",
            "Текстурована поверхня M8.",
            "Індивідуальна перфорація M9.",
            "Ультра-тонка накладка M10.",
            "Комбінований Hi-Tech дизайн.",
            "Преміальна серія M12."
        ];

        for (let i = 1; i <= 12; i++) {
            grid.innerHTML += `
            <div class="product-card">
                <div class="viewer-box">
                    <model-viewer 
                        src="cosmetic${i}.glb" 
                        loading="lazy" 
                        reveal="manual"
                        ar ar-modes="webxr scene-viewer quick-look" 
                        camera-controls 
                        auto-rotate 
                        shadow-intensity="1" 
                        exposure="1"
                        ar-placement="floor"
                        touch-action="pan-y">
                        <button slot="ar-button" class="ar-btn">🔴 AR ПРИМІРКА</button>
                    </model-viewer>
                </div>
                <div class="info-box">
                    <div class="model-id">M${i}</div>
                    <div class="line"></div>
                    <p class="description">${descriptions[i-1]}</p>
                    <a href="https://t.me/your_username" class="btn-order">ЗАМОВИТИ</a>
                </div>
            </div>
            `;
        }
    </script>
</div>

<footer>
    &copy; 2026 MED3DRUK STUDIO | Optimized for iPhone & iPad
</footer>

</body>
</html>
