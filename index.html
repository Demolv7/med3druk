<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MED3DRUK | Smart Catalog</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #ff0000; --primary: #000000; --bg: #ffffff; --light-gray: #f5f5f7; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); }
        
        header { 
            padding: 20px 5%; border-bottom: 1px solid #eee; display: flex; 
            justify-content: space-between; align-items: center; background: #fff; 
            position: sticky; top: 0; z-index: 100; 
        }
        .logo { font-weight: 800; font-size: 1.5rem; text-decoration: none; color: #000; }
        .logo span { color: var(--accent); }

        .catalog-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px; padding: 30px 5%; max-width: 1400px; margin: 0 auto;
        }

        .product-card {
            background: var(--bg); border-radius: 15px; overflow: hidden;
            border: 1px solid #eee; display: flex; flex-direction: column;
        }

        .viewer-box { width: 100%; height: 300px; background: var(--light-gray); position: relative; }

        /* Оптимізований плеєр */
        model-viewer {
            width: 100%; height: 100%;
            --poster-color: #f5f5f7;
        }

        .info-box { padding: 20px; text-align: left; }
        .model-id { font-weight: 800; font-size: 1.8rem; margin: 0; }
        .line { width: 30px; height: 4px; background: var(--accent); margin: 8px 0; }
        .description { color: #666; font-size: 0.85rem; margin-bottom: 15px; min-height: 3em; }

        .ar-btn {
            background: #fff; color: #000; border-radius: 50px; border: 1px solid #ddd;
            padding: 8px 12px; font-weight: 700; font-size: 10px;
            position: absolute; bottom: 10px; right: 10px; cursor: pointer;
        }

        .btn-order {
            background: var(--primary); color: #fff; padding: 12px;
            border-radius: 8px; text-decoration: none; font-weight: 700;
            text-align: center; font-size: 0.9rem; display: block;
        }
        .btn-order:hover { background: var(--accent); }

        footer { text-align: center; padding: 40px; color: #ccc; font-size: 0.8rem; }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">MED3<span>DRUK</span></a>
</header>

<div class="catalog-grid">
    <script>
        for (let i = 1; i <= 12; i++) {
            document.write(`
            <div class="product-card">
                <div class="viewer-box">
                    <model-viewer 
                        src="cosmetic${i}.glb" 
                        loading="lazy" 
                        reveal="manual"
                        ar ar-modes="webxr scene-viewer quick-look" 
                        camera-controls 
                        shadow-intensity="1" 
                        exposure="1"
                        touch-action="pan-y">
                        <button slot="ar-button" class="ar-btn">🔴 AR</button>
                    </model-viewer>
                </div>
                <div class="info-box">
                    <div class="model-id">M${i}</div>
                    <div class="line"></div>
                    <p class="description">Професійна накладка Med3Druk. Оптимізовано для 3D друку.</p>
                    <a href="#" class="btn-order">ЗАМОВИТИ</a>
                </div>
            </div>
            `);
        }
    </script>

</div>

<footer>&copy; 2026 MED3DRUK STUDIO</footer>

</body>
</html>
